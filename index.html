<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University AI Skills Hub</title>
<meta name="description" content="AI skills colleagues actually use. Add one through a short form.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14231f; --muted:#5a6b66; --line:#dbe3e0;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#dcece6; --warn:#a4441f;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1715; --surface:#16211e; --ink:#e3ece9; --muted:#9aaca6; --line:#2a3a35;
  --accent:#5fc3a6; --accent-ink:#06241c; --accent-soft:#1d3a32; --warn:#f0a07c; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:40px 8px}
h1{font:700 clamp(30px,5vw,42px)/1.1 var(--display);margin:0 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 20px;max-width:58ch}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;text-decoration:none;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:10px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.search{display:block;width:100%;margin-block:24px 8px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.btn:focus-visible,.search:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{padding-block:16px}
h2{font:700 20px var(--display);margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
h2 span{font:500 14px var(--body);color:var(--muted)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
li{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
li:first-child{border-top:0}
.name{font-weight:600;font-size:17px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
a.name:hover{color:var(--accent);text-decoration:underline}
a.name::after{content:" \2197";color:var(--accent);font-size:14px}
.desc{margin:0;color:var(--ink)}
.by{font-size:13px;color:var(--muted)}
.warn{font-size:13px;color:var(--warn)}
.sug{font-size:13px;color:var(--muted);margin:4px 0 0;padding-left:10px;border-left:2px solid var(--accent-soft)}
.empty{color:var(--muted)}
footer{color:var(--muted);font-size:13px;padding-block:24px 40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>University AI Skills Hub</h1>
    <p class="lede">AI skills and prompts that colleagues actually use. Click a name to open it. Using something helpful? Add it in a one-minute form. You don't need a GitHub account.</p>
    <div class="actions">
      <a class="btn" data-form="addFormUrl" href="#" target="_blank" rel="noopener">Add a skill</a>
      <a class="btn ghost" data-form="suggestFormUrl" href="#" target="_blank" rel="noopener">Suggest a change</a>
    </div>
    <input class="search" id="q" type="search" placeholder="Search, for example: travel, review, video" aria-label="Search skills">
  </header>
  <main id="list"><p class="empty">Loading the catalog…</p></main>
  <footer id="foot"></footer>
</div>
<script>
const ORDER=["Research","Administrative for Research","General","Teaching and Education","Software and Development"];
let skills=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const shown=skills.filter(s=>!q||[s.name,s.category,s.description,s.made_by,s.suggested_by,s.added_by].join(" ").toLowerCase().includes(q));
  const cats=[...ORDER,...new Set(shown.map(s=>s.category))].filter((c,i,a)=>a.indexOf(c)===i&&shown.some(s=>s.category===c));
  document.getElementById("list").innerHTML=cats.length?cats.map(c=>{
    const items=shown.filter(s=>s.category===c);
    return `<section><h2>${esc(c)} <span>${items.length}</span></h2><ul>${items.map(s=>{
      const name=/^https?:\/\//.test(s.link||"")?`<a class="name" href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:`<span class="name">${esc(s.name)}</span>`;
      const by=[s.made_by&&`Made by ${s.made_by}`,s.suggested_by&&`Suggested by ${s.suggested_by}`,s.added_by&&`Added by ${s.added_by}`].filter(Boolean).join(" · ");
      return `<li>${name}<p class="desc">${esc(s.description||"Details coming soon.")}</p>${by?`<span class="by">${esc(by)}</span>`:""}${s.caution?'<span class="warn">Uses university systems. Follow university IT and data policies.</span>':""}${(s.suggestions||[]).map(x=>`<p class="sug">${esc(x.text)}${x.by?` (suggested by ${esc(x.by)})`:""}</p>`).join("")}</li>`;
    }).join("")}</ul></section>`;
  }).join(""):'<p class="empty">Nothing matches that search. Try another word, or add the skill yourself.</p>';
}
document.getElementById("q").addEventListener("input",render);
Promise.all([
  fetch("data/skills.json",{cache:"no-store"}).then(r=>r.json()),
  fetch("config.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({}))
]).then(([data,cfg])=>{
  skills=data.skills||[];
  document.querySelectorAll("[data-form]").forEach(a=>{
    const url=cfg[a.dataset.form];
    if(url)a.href=url;else{a.setAttribute("aria-disabled","true");a.title="The form isn't connected yet";a.addEventListener("click",e=>e.preventDefault());}
  });
  document.getElementById("foot").textContent=`${skills.length} skills · updated ${data.synced||""}`;
  render();
}).catch(()=>{document.getElementById("list").innerHTML='<p class="empty">The catalog could not load. Refresh the page to try again.</p>';});
</script>
</body>
</html>
