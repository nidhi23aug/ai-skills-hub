name: Rebuild catalog from the Google Doc

on:
  push:
    paths: ["data/catalog-doc.txt", "data/seed.json", "scripts/sync.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: catalog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync.py
      - name: Commit if the catalog changed
        run: |
          if git diff --quiet data/skills.json; then exit 0; fi
          git config user.name "skills-hub-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/skills.json
          git commit -m "Rebuild catalog from Google Doc"
          git push
