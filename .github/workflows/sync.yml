name: Sync catalog from forms

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run workflow" button for an instant update

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge approved form responses
        env:
          ADD_FORM_CSV: ${{ vars.ADD_FORM_CSV }}
          SUGGEST_FORM_CSV: ${{ vars.SUGGEST_FORM_CSV }}
        run: python scripts/sync.py
      - name: Commit if the catalog changed
        run: |
          if git diff --quiet data/skills.json; then exit 0; fi
          git config user.name "skills-hub-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/skills.json
          git commit -m "Update catalog from form responses"
          git push
